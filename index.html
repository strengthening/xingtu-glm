<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="星图 xingtu — 浏览器端星空/天象仪" />
    <title>星图 xingtu</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23071018'/%3E%3Ccircle cx='16' cy='16' r='2.4' fill='%23ffe9b0'/%3E%3Ccircle cx='9' cy='12' r='1.3' fill='%23cfe4ff'/%3E%3Ccircle cx='23' cy='13' r='1.1' fill='%23cfe4ff'/%3E%3Ccircle cx='12' cy='23' r='1.0' fill='%23cfe4ff'/%3E%3Ccircle cx='22' cy='22' r='0.8' fill='%23cfe4ff'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/style.css" />

  <body>
    <div id="app">
      <canvas id="sky"></canvas>
      <!-- DOM overlay: star labels / cardinal markers, positioned each frame -->
      <div id="overlay"></div>
      <!-- Top-left: location / time / toggles -->
      <div id="panel" class="panel"></div>
      <!-- Bottom-left: playback controls -->
      <div id="timebar" class="timebar"></div>
      <!-- Info card for the selected object -->
      <div id="infocard" class="infocard hidden"></div>
      <footer id="credits">

        银河全景：ESO/S. Brunier (CC BY 4.0) · 天文计算：astronomy-engine (MIT) ·
        代码：MIT
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
